name: Relatar defeito
description: Descreva um problema reproduzível
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: "Não publique segredos ou dados privados. Para vulnerabilidades, consulte SECURITY.md."
  - type: input
    id: version
    attributes:
      label: Versão ou commit
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Passos para reproduzir
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Resultado esperado
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Resultado observado
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Ambiente e evidências sem segredos
